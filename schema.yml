openapi: 3.0.3
info:
  title: PetShop API
  version: 1.0.0
  description: |-
    API інтернет-магазину товарів для тварин: каталог (категорії, бренди, товари) та авторизація за JWT.

    Читати каталог можуть усі. Створювати, змінювати й видаляти - лише адміністратор. Захищені запити потребують заголовок `Authorization: Bearer <access-токен>`; токен видає `POST /api/auth/login`.

    Усі помилки мають формат `{"error": "..."}`, для 400 додається `details` з помилками по полях.
paths:
  /api/auth/login:
    post:
      operationId: auth_login_create
      description: 'Перевіряє ім''я користувача й пароль і видає два токени: access
        (живе 5 хвилин, передається в Authorization: Bearer) та refresh (живе 7 днів,
        потрібен лише для POST /api/auth/refresh).'
      summary: 'Вхід: отримати токени'
      tags:
      - Авторизація
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            examples:
              Вхід:
                value:
                  username: anna
                  password: Str0ng-pass-2026
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ПорожняНазва:
                  value:
                    error: Некоректні дані.
                    details:
                      name:
                      - Це поле не може бути порожнім.
                  summary: Порожня назва
          description: '400: некоректні дані або зламаний JSON.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Приклад:
                  value:
                    error: Невірне ім'я користувача або пароль.
          description: '401: невірне ім''я користувача або пароль.'
  /api/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: Обмінює refresh-токен на новий access-токен. Викликається, коли
        захищений запит повернув 401.
      summary: Оновити access-токен
      tags:
      - Авторизація
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Refresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Refresh'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ПорожняНазва:
                  value:
                    error: Некоректні дані.
                    details:
                      name:
                      - Це поле не може бути порожнім.
                  summary: Порожня назва
          description: '400: некоректні дані або зламаний JSON.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Приклад:
                  value:
                    error: Термін дії токена закінчився.
          description: '401: refresh-токен недійсний або прострочений.'
  /api/auth/register:
    post:
      operationId: auth_register_create
      description: Створює звичайного користувача (не адміністратора). Токен не потрібен.
        Пароль зберігається лише у вигляді хешу.
      summary: Реєстрація
      tags:
      - Авторизація
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
            examples:
              НоваКористувачка:
                value:
                  username: anna
                  first_name: Анна
                  last_name: Коваль
                  email: anna@example.com
                  password: Str0ng-pass-2026
                  password_confirmation: Str0ng-pass-2026
                summary: Нова користувачка
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ПорожняНазва:
                  value:
                    error: Некоректні дані.
                    details:
                      name:
                      - Це поле не може бути порожнім.
                  summary: Порожня назва
          description: '400: некоректні дані або зламаний JSON.'
